<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storymap to GitHub, preview</title>
<style>
  body { margin: 0; padding: 24px; background: #e9e9e9; font: 13px -apple-system, sans-serif; display: flex; gap: 24px; align-items: flex-start; }
  iframe { width: 420px; height: 680px; border: 0; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.18); background: #fff; }
  aside { max-width: 320px; color: #333; }
  pre { background: #fff; padding: 8px; border-radius: 6px; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<iframe id="ui" src="../ui.html" title="Plugin UI"></iframe>
<aside>
  <p><b>Browser preview of the plugin UI.</b> The board is a made-up sample. In the GitHub tab, any public repository works for the comparison.</p>
  <p><label><input type="checkbox" id="dark"> Dark theme</label></p>
  <p>Messages sent by the UI:</p>
  <pre id="log"></pre>
</aside>
<script src="../code.js"></script>
<script src="sample-board.js"></script>
<script>
  let repo = new URLSearchParams(location.search).get('repo') || '';
  const frame = document.getElementById('ui');
  const items = sampleBoard();
  const palette = buildPalette(items);
  const legend = defaultLegend(palette);
  let issues = null;
  let sprints = [];
  const links = {};

  const post = () => {
    const backlog = buildBacklog(items, legend);
    const matches = issues ? matchIssues(backlog, issues, links) : {};
    frame.contentWindow.postMessage({ pluginMessage: {
      type: 'board', scope: 'page', page: 'Story map', palette, legend, backlog, matches,
      issues: issues ? issues.map((i) => ({ number: i.number, title: i.title, sprint: i.sprint ? i.sprint.title : null, status: i.status || null, size: i.size || null })) : [],
      sprints,
      drift: issues ? findDrift(backlog, issues, matches) : null,
      nodeTypes: { STICKY: items.length },
      markdown: toMarkdown(backlog, matches),
      settings: { repo, hasToken: false, issuesLoaded: issues ? issues.length : null },
    } }, '*');
  };

  window.addEventListener('message', async (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    document.getElementById('log').textContent = JSON.stringify(msg) + '\n' + document.getElementById('log').textContent;
    if (msg.type === 'ready' || msg.type === 'refresh') post();
    if (msg.type === 'set-legend') { legend[msg.hex] = msg.value; post(); }
    if (msg.type === 'why') {
      const res = await fetch(`https://api.github.com/repos/${repo}/issues/${msg.number}/events?per_page=100`);
      const lines = res.ok ? explainEvents(await res.json(), msg.kind) : null;
      frame.contentWindow.postMessage({ pluginMessage: { type: 'why-result', key: msg.key, lines, error: res.ok ? null : `GitHub answered ${res.status}.` } }, '*');
    }
    if (msg.type === 'link') { if (msg.number === null) delete links[msg.id]; else links[msg.id] = msg.number; post(); }
    if (msg.type === 'compare') {
      repo = (msg.repo || '').trim();
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=all&per_page=100`);
        if (!res.ok) throw new Error(`GitHub answered ${res.status}.`);
        issues = (await res.json()).filter((i) => !i.pull_request).map((i) => ({
          number: i.number, title: i.title, html_url: i.html_url, state: i.state, state_reason: i.state_reason || null,
          type: i.type ? i.type.name : null, milestone: i.milestone ? i.milestone.title : null, milestoneDue: i.milestone && i.milestone.due_on ? i.milestone.due_on.slice(0, 10) : null,
          parent: i.parent_issue_url ? Number(i.parent_issue_url.split('/').pop()) : null,
        }));
        // Sprints: the browser has no token, so the preview reads a project
        // saved by hand in dev/local/project.json (git-ignored), if any.
        try {
          const saved = await fetch('local/project.json');
          if (saved.ok) {
            const project = await saved.json();
            sprints = project.sprints;
            issues = issues.map((i) => ({ ...i, ...(project.items[`${repo}#${i.number}`.toLowerCase()] || {}) }));
          }
        } catch (err) { /* no saved project: no sprints */ }
        post();
        frame.contentWindow.postMessage({ pluginMessage: { type: 'status', state: 'ok', text: `${issues.length} issues read from ${repo}.` } }, '*');
      } catch (err) {
        frame.contentWindow.postMessage({ pluginMessage: { type: 'status', state: 'error', text: err.message } }, '*');
      }
    }
  });

  document.getElementById('dark').addEventListener('change', (e) => {
    frame.contentDocument.documentElement.classList.toggle('dev-dark', e.target.checked);
  });
</script>
</body>
</html>
