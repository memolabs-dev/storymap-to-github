<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storymap to GitHub, cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* The Figma Community thumbnail, 1920 x 1080. Rendered to cover.png by render.sh. */
  html, body { margin: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden; box-sizing: border-box;
    background-color: var(--sm-canvas);
    background-image: radial-gradient(var(--sm-rule) 2px, transparent 2.4px);
    background-size: 36px 36px;
    color: var(--sm-ink); font-family: var(--sm-body);
    display: grid; grid-template-columns: 760px 1fr; gap: 72px; align-items: center; padding: 0 0 0 128px;
  }
  .text { display: grid; gap: 40px; }
  .mark { width: 168px; height: 168px; }
  h1 { margin: 0; font: 800 104px/1.02 var(--sm-display); letter-spacing: -0.01em; }
  h1 span { font-weight: 500; color: var(--sm-muted); }
  p { margin: 0; font-size: 38px; line-height: 1.3; color: var(--sm-muted); max-width: 17em; }
  .tag { justify-self: start; font: 500 26px/1 var(--sm-mono); background: #fff; border: 3px solid #8b919a; border-radius: 999px; padding: 14px 24px; }
  .shot { height: 1080px; overflow: hidden; display: flex; align-items: center; }
  .shot img { width: 1060px; border-radius: 24px 0 0 24px; box-shadow: 0 2px 6px rgba(20,24,30,.08), 0 24px 60px rgba(20,24,30,.14); }
</style>
</head>
<body>
  <div class="text">
    <img class="mark" src="icon.svg" alt="">
    <h1>Storymap <span>to</span><br>GitHub</h1>
    <p>Read your FigJam story map as a backlog, and keep it in step with GitHub.</p>
    <span class="tag">#6 · Sprint 1 · In Progress</span>
  </div>
  <div class="shot"><img src="../docs/images/en/board-labels.jpg" alt=""></div>
</body>
</html>
